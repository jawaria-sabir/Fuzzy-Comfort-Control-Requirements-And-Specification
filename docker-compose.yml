version: "3.9"

services:
  fuzzy-control:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: fuzzy-comfort-control
    ports:
      - "5000:5000"
    environment:
      - FLASK_ENV=production
      - PYTHONDONTWRITEBYTECODE=1
      - PYTHONUNBUFFERED=1
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5000/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

  # Optional: nginx reverse proxy for production
  # nginx:
  #   image: nginx:alpine
  #   ports:
  #     - "80:80"
  #   volumes:
  #     - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
  #   depends_on:
  #     - fuzzy-control
  #   restart: unless-stopped

volumes: {}
networks:
  default:
    name: fuzzy-network
